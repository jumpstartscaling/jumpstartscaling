server {
    listen 80;
    listen [::]:80;
    server_name rec.jumpstartscaling.com;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rec.jumpstartscaling.com;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/rec.jumpstartscaling.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rec.jumpstartscaling.com/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Client max body size (for large file uploads)
    client_max_body_size 500M;

    # Proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Proxy to Stream-Rec frontend
    location / {
        proxy_pass http://127.0.0.1:15275;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # WebSocket support for live updates
    location /live/update {
        proxy_pass http://127.0.0.1:12555/live/update;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # API endpoints (if accessed directly)
    location /api {
        proxy_pass http://127.0.0.1:12555/api;
        proxy_http_version 1.1;
    }

    # Access and error logs
    access_log /var/log/nginx/stream-rec-access.log;
    error_log /var/log/nginx/stream-rec-error.log;
}
