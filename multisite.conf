# JumpStart Scaling (Default)
server {
    server_name jumpstartscaling.com www.jumpstartscaling.com;
    
    location / {
        proxy_pass http://localhost:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl default_server; 
    ssl_certificate /etc/letsencrypt/live/jumpstartscaling.com/fullchain.pem; 
    ssl_certificate_key /etc/letsencrypt/live/jumpstartscaling.com/privkey.pem; 
    include /etc/letsencrypt/options-ssl-nginx.conf; 
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; 
}

# Chris Amaya
server {
    server_name chrisamaya.work www.chrisamaya.work;
    
    location / {
        proxy_pass http://localhost:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
}

# API (Strict)
server {
    server_name api.jumpstartscaling.com;
    
    location / {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; 
    ssl_certificate /etc/letsencrypt/live/api.jumpstartscaling.com/fullchain.pem; 
    ssl_certificate_key /etc/letsencrypt/live/api.jumpstartscaling.com/privkey.pem; 
    include /etc/letsencrypt/options-ssl-nginx.conf; 
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; 
}

# n8n
server {
    server_name n8n.jumpstartscaling.com;
    
    location / {
        proxy_pass http://localhost:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
    }

    listen 443 ssl; 
    ssl_certificate /etc/letsencrypt/live/n8n.jumpstartscaling.com/fullchain.pem; 
    ssl_certificate_key /etc/letsencrypt/live/n8n.jumpstartscaling.com/privkey.pem; 
    include /etc/letsencrypt/options-ssl-nginx.conf; 
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; 
}

# Redirects
server {
    if ($host = api.jumpstartscaling.com) {
        return 301 https://$host$request_uri;
    } 

    if ($host = www.jumpstartscaling.com) {
        return 301 https://$host$request_uri;
    } 

    if ($host = jumpstartscaling.com) {
        return 301 https://$host$request_uri;
    } 

    if ($host = n8n.jumpstartscaling.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name jumpstartscaling.com www.jumpstartscaling.com n8n.jumpstartscaling.com api.jumpstartscaling.com;
    return 404; 
}
